name: Deploy to BigRock (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel web root. If your FTP user already lands in public_html,
          # change this to "./"
          server-dir: public_html/
          # Use "ftps" if BigRock supports it (recommended); otherwise "ftp"
          protocol: ftp
          # NOTE: do NOT blanket-exclude *.jpg/*.jpeg — the design gallery
          # images live in assets/designs and must be uploaded. Only skip
          # the raw source folders and large one-off files.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            WHATSAPP-SETUP.md
            *.pdf
            *.zip
            simplecakes/**
            specialcakes/**
            posters.jpeg
